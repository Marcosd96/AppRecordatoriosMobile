<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fondo azul -->
  <rect width="1024" height="1024" fill="#1e40af" rx="192"/>
  
  <!-- Icono de calculadora/documento -->
  <g transform="translate(192, 192)">
    <!-- Documento -->
    <rect x="128" y="64" width="384" height="512" fill="#ffffff" rx="32"/>
    
    <!-- Líneas del documento -->
    <line x1="224" y1="192" x2="416" y2="192" stroke="#1e40af" stroke-width="32" stroke-linecap="round"/>
    <line x1="224" y1="288" x2="416" y2="288" stroke="#1e40af" stroke-width="32" stroke-linecap="round"/>
    <line x1="224" y1="384" x2="352" y2="384" stroke="#1e40af" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Símbolo de peso/dinero -->
    <circle cx="320" cy="480" r="96" fill="#10b981" stroke="#ffffff" stroke-width="24"/>
    <text x="320" y="520" font-family="Arial, sans-serif" font-size="128" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
  </g>
  
  <!-- Decoración: gráfico pequeño -->
  <g transform="translate(640, 640)">
    <polyline points="0,128 64,64 128,96 192,32" fill="none" stroke="#60a5fa" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

