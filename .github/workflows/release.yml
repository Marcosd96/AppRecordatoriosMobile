name: Mobile Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_SDK_COMPONENTS: |
    platform-tools
    platforms;android-34
    build-tools;34.0.0

jobs:
  quality-checks:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --runInBand

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            ${{ env.ANDROID_SDK_COMPONENTS }}

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: npm run build:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gesaccol-android-${{ github.ref_name }}
          path: releases/Gesaccol-debug.apk

  ios-build:
    name: iOS Archive (simulator)
    runs-on: macos-14
    needs: quality-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Build iOS app (simulator)
        run: |
          set -eo pipefail
          xcodebuild \
            -workspace ios/AppRecordatoriosMobile.xcworkspace \
            -scheme AppRecordatoriosMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | xcpretty

      - name: Zip simulator build
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r Gesaccol-iOS-${{ github.ref_name }}.zip AppRecordatoriosMobile.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gesaccol-ios-${{ github.ref_name }}
          path: ios/build/Build/Products/Release-iphonesimulator/Gesaccol-iOS-${{ github.ref_name }}.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android-build
      - ios-build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded files
        run: ls -R dist

      - name: Collect artifact paths
        id: artifacts
        run: |
          APK_PATH=$(find dist -name "Gesaccol-debug.apk" -print -quit)
          IOS_PATH=$(find dist -name "Gesaccol-iOS-*.zip" -print -quit)
          if [ -z "$APK_PATH" ] || [ -z "$IOS_PATH" ]; then
            echo "No se encontraron artefactos para publicar" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "ios_path=$IOS_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.apk_path }}
            ${{ steps.artifacts.outputs.ios_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

